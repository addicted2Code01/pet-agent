[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-agent"
version = "0.1.0"
dependencies = [
    "streamlit",
    "sqlmodel",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-huggingface",
    "chromadb",
    "litellm",
    "discord.py",
    "python-dotenv",
    "pydantic",
]
